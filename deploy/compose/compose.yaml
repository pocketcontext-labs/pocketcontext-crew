# Requires Docker Compose 2.30+ (raw env_file support).
services:
  crew:
    image: ghcr.io/pocketcontext-labs/pocketcontext-crew@sha256:cf8b485bf331d68687770fe3d07c62b571f9e997a2dbec28961981d533bb19ad
    command: [serve]
    env_file:
      - path: ./crew.env
        format: raw
    environment:
      POCKETCONTEXT_DOMAIN: ${CREW_DOMAIN:?Set CREW_DOMAIN in .env}
    volumes:
      - crew_data:/storage
    restart: unless-stopped
    stop_grace_period: 300s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/up', timeout=5).read()"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      CREW_DOMAIN: ${CREW_DOMAIN:?Set CREW_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      crew:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  crew_data:
  caddy_data:
  caddy_config:
